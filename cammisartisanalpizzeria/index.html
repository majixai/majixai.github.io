<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Cammis's Artisanal Pizzeria</title>
    <style>
        :root {
            --page-bg: #111111;
            --spinner: #d4a359;
            --spinner-track: rgba(255,255,255,0.18);
        }

        * {
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            background: var(--page-bg);
            overflow: hidden;
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        html::-webkit-scrollbar,
        body::-webkit-scrollbar {
            display: none;
        }

        body {
            display: flex;
            align-items: stretch;
            justify-content: stretch;
            min-height: 100vh;
            min-height: 100dvh;
        }

        .frame-shell {
            position: relative;
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            background: var(--page-bg);
            overflow: hidden;
        }

        .menu-frame {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            border: 0;
            display: block;
            background: #ffffff;
            overflow: hidden;
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        .menu-frame::-webkit-scrollbar {
            display: none;
        }

        .loader {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(17, 17, 17, 0.75);
            backdrop-filter: blur(2px);
            z-index: 2;
            transition: opacity 0.25s ease, visibility 0.25s ease;
        }

        .loader.hidden {
            opacity: 0;
            visibility: hidden;
        }

        .spinner {
            width: 52px;
            height: 52px;
            border: 4px solid var(--spinner-track);
            border-top-color: var(--spinner);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            box-shadow: 0 0 12px rgba(212, 163, 89, 0.3);
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        @media (max-width: 768px) {
            .frame-shell {
                width: 100%;
                height: 100vh;
                height: 100dvh;
            }
        }
    </style>
</head>
<body>
    <div class="frame-shell">
        <div id="loader" class="loader" aria-live="polite" aria-label="Loading menu">
            <div class="spinner"></div>
        </div>

        <iframe
            id="menuFrame"
            class="menu-frame"
            src="https://script.google.com/macros/s/AKfycbw9x494aLQzMYJaiP-4PmjDrMcXH8g8xr70BjDJlQ3lZSaUXjJofEFVRFHX95iaGmt-XA/exec"
            title="Cammis's Artisanal Pizzeria"
            allowfullscreen
            loading="eager"
            scrolling="no"
            referrerpolicy="strict-origin-when-cross-origin"
        ></iframe>
    </div>

    <script>
        const iframe = document.getElementById('menuFrame');
        const loader = document.getElementById('loader');

        iframe.addEventListener('load', function () {
            setTimeout(function () {
                loader.classList.add('hidden');
            }, 150);
        });
    </script>
</body>
</html>
