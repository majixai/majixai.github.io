<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#2d3748">
  <meta name="description" content="MajixAI Linux — a lightweight Linux-focused project landing page">
  <title>MajixAI Linux</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0f172a;
      --panel: #111827;
      --border: #334155;
      --text: #e2e8f0;
      --muted: #94a3b8;
      --accent: #60a5fa;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: radial-gradient(circle at top, #1e293b 0%, var(--bg) 55%);
      color: var(--text);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    main {
      width: min(720px, calc(100vw - 2rem));
      padding: 2rem;
      border: 1px solid var(--border);
      border-radius: 1rem;
      background: rgba(17, 24, 39, 0.9);
      box-shadow: 0 24px 80px rgba(15, 23, 42, 0.45);
    }
    h1 {
      margin: 0 0 .5rem;
      font-size: clamp(2rem, 4vw, 3rem);
    }
    p { margin: .5rem 0 0; color: var(--muted); line-height: 1.6; }
    .links { margin-top: 1.5rem; display: flex; flex-wrap: wrap; gap: .75rem; }
    a {
      color: var(--accent);
      text-decoration: none;
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: .65rem 1rem;
      background: rgba(15, 23, 42, 0.7);
    }
    a:hover { border-color: var(--accent); }
    code {
      display: inline-block;
      margin-top: 1rem;
      padding: .25rem .5rem;
      border-radius: .4rem;
      background: #020617;
      color: #cbd5e1;
    }
  </style>
</head>
<body>
  <main>
    <h1>MajixAI Linux</h1>
    <p>
      A top-level Linux project scaffold for platform-specific notes, utilities,
      and future experiments.
    </p>
    <p>
      This page is intentionally lightweight so the existing commit-driven PWA
      and README workflows can pick it up automatically.
    </p>
    <div class="links">
      <a href="../README.md">Repository README</a>
      <a href="../index.html">Project index</a>
    </div>
    <code>linux/</code>
  </main>
</body>
</html>
