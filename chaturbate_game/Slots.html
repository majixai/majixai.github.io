<!DOCTYPE html>
<html>
<head>
    <title>Slot Machine Overlay</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden; /* Hide scrollbars */
            background-color: transparent; /* Make overlay background transparent */
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh; /* Occupy full viewport height */
            font-family: sans-serif;
            color: white;
            text-shadow: 1px 1px 2px black;
        }

        #slotMachineContainer {
            display: flex;
            flex-direction: column; /* Stack reels and result */
            align-items: center;
            user-select: none; /* Prevent text selection on symbols */
        }

        #reelsContainer {
            display: flex;
            border: 5px solid #a16a1c; /* Frame */
            border-radius: 10px;
            background-color: rgba(0, 0, 0, 0.6); /* Semi-transparent background */
            padding: 5px;
            gap: 5px; /* Space between reels */
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.5); /* Gold glow */
        }

        .reel {
            /* Width will be calculated based on number of reels */
            height: 120px; /* Visible height for one symbol - adjust if needed */
            overflow: hidden; /* Hide symbols outside the view */
            position: relative;
            border: 1px solid #333;
            border-radius: 5px;
            background-color: #222;
        }

        .reel-symbols {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
             /* Symbols will be dynamically populated and this will be adjusted */
            transition: transform 2s cubic-bezier(0.25, 0.1, 0.25, 1.0); /* Smooth stop */
        }

        .symbol {
            height: 120px; /* Symbol height - MUST match reel height for alignment */
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 40px; /* Adjust symbol size */
            font-weight: bold;
            /* Basic symbol styling - customize per symbol if needed via classes */
        }

        .symbol.symbol-BAR { /* Example custom styling for ' BAR ' */
             font-size: 20px;
        }
         .symbol.symbol-7 { /* Example custom styling for ' 7 ' */
             color: #ff0000; /* Red 7s */
         }
         .symbol.symbol-💎 { /* Example custom styling for diamond */
             color: aqua;
         }


        #resultDisplay {
            margin-top: 15px;
            padding: 10px 20px;
            background-color: rgba(0, 0, 0, 0.7);
            border-radius: 8px;
            font-size: 20px;
            font-weight: bold;
            min-height: 1em; /* Reserve space */
            text-align: center;
             opacity: 0; /* Start hidden */
             transition: opacity 0.5s ease-in-out;
        }
         #resultDisplay.visible {
             opacity: 1;
         }

        #winDisplay {
             margin-top: 10px;
             padding: 8px 15px;
             background-color: rgba(0, 128, 0, 0.7); /* Green background for wins */
             border-radius: 6px;
             font-size: 18px;
             font-weight: bold;
             text-align: center;
             opacity: 0; /* Start hidden */
             transition: opacity 0.5s ease-in-out;
        }
         #winDisplay.visible {
             opacity: 1;
             animation: winGlow 1.5s infinite alternate; /* Simple win animation */
         }
         @keyframes winGlow {
             from { box-shadow: 0 0 5px rgba(0,255,0,0.3); }
             to { box-shadow: 0 0 20px rgba(0,255,0,0.9); }
         }

         #spinButton {
             position: absolute; /* For testing or manual triggers */
             bottom: 10px;
             left: 50%;
             transform: translateX(-50%);
             padding: 8px 15px;
             cursor: pointer;
             z-index: 100; /* Ensure it's clickable */
             /* display: none; */ /* Keep visible for testing */
         }

    </style>
</head>
<body>
    <div id="slotMachineContainer">
        <div id="reelsContainer">
            <!-- Reels will be dynamically added here by JavaScript after config is received -->
        </div>
        <div id="resultDisplay">Loading config...</div>
        <div id="winDisplay"></div> <!-- Added for win messages -->
        <button id="spinButton">Test Spin</button> <!-- Test button -->
    </div>
</body>
</html>
