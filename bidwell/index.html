<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Detailed 7-Unit Layout</title>
    <style>
        .container { display: flex; flex-wrap: wrap; gap: 20px; padding: 20px; }
        .unit { border: 2px solid #333; background: #fafafa; width: 300px; height: 180px; position: relative; display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; }
        .room { border: 1px dashed #666; display: flex; align-items: center; justify-content: center; font-size: 0.75rem; background: #fff; }
        
        /* Fixture Indicators */
        .door { background: #2e7d32; width: 40px; height: 8px; position: absolute; bottom: 0; left: 130px; }
        .window { background: #1565c0; width: 60px; height: 6px; position: absolute; top: 0; left: 120px; }
        .fixture-elec { position: absolute; top: 10px; left: 10px; width: 10px; height: 10px; background: #d32f2f; border-radius: 50%; }
        .fixture-plumb { position: absolute; bottom: 10px; right: 10px; width: 10px; height: 10px; background: #00796b; border-radius: 50%; }
    </style>
</head>
<body>
    <h1>7-Unit Interior Layout</h1>
    <div class="container">
        <!-- Example Unit with Interior Partitioning -->
        <div class="unit">
            <div class="room">Living Room</div>
            <div class="room">Kitchen</div>
            <div class="room">Bathroom</div>
            <div class="room">Bedroom</div>
            <div class="door"></div>
            <div class="window"></div>
            <div class="fixture-elec"></div> <!-- Electrical Point -->
            <div class="fixture-plumb"></div> <!-- Plumbing Point -->
        </div>
    </div>
</body>
</html>
