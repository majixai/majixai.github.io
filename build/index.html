<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>1 TH/s ASIC Miner - 3D Hardware Viewer</title>
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.3.0/model-viewer.min.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #1e1e1e; color: #fff; text-align: center; margin: 0; padding: 20px; }
        model-viewer { width: 100%; height: 600px; background-color: #2a2a2a; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); margin-bottom: 20px; }
        .btn { display: inline-block; padding: 10px 20px; background-color: #f7931a; color: #1e1e1e; text-decoration: none; font-weight: bold; border-radius: 5px; transition: 0.3s; }
        .btn:hover { background-color: #e07b09; }
    </style>
</head>
<body>

    <h1>1 TH/s Custom BM1366 Pool Miner</h1>
    <p>Interactive 3D Hardware Render (ESP32-S3 + 5x BM1366 Array)</p>

    <model-viewer 
        src="assets/miner_board.glb" 
        alt="A 3D model of the 1 TH/s ASIC Miner PCB" 
        auto-rotate 
        camera-controls 
        shadow-intensity="1"
        exposure="1.2">
    </model-viewer>

    <br>
    <h2>Deep-Dive Schematics</h2>
    <p>Inspect the heavy copper pours, component placement, and trace routing layer by layer.</p>
    <a href="ibom.html" class="btn" target="_blank">Open Interactive Schematic (iBOM)</a>
    <a href="https://github.com/YourUsername/YourRepoName" class="btn">Return to GitHub Repo</a>

</body>
</html>
