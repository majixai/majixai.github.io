<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Schematics Viewer</title>
    <style>
      :root { color-scheme: dark; }
      body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #020617;
        color: #f8fafc;
      }
      main {
        max-width: 960px;
        margin: 0 auto;
        padding: 2rem 1rem 3rem;
      }
      .card {
        background: #111827;
        border: 1px solid #1f2937;
        border-radius: 16px;
        padding: 1.5rem;
        box-shadow: 0 12px 30px rgba(0, 0, 0, 0.35);
      }
      img {
        width: 100%;
        max-width: 640px;
        display: block;
        margin: 1rem 0;
        border-radius: 12px;
        border: 1px solid #334155;
      }
      code {
        background: #0f172a;
        padding: 0.2rem 0.4rem;
        border-radius: 6px;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="card">
        <h1>Schematics Viewer</h1>
        <p>This page displays the generated schematic artifacts from the workflow.</p>
        <img id="schematic-image" src="output/schematic.svg" alt="Generated schematic" />
        <h2>Components</h2>
        <ul id="component-list"></ul>
      </div>
    </main>
    <script>
      fetch('output/manifest.json')
        .then((response) => response.json())
        .then((manifest) => {
          document.title = manifest.title;
          const list = document.getElementById('component-list');
          manifest.components.forEach((component) => {
            const item = document.createElement('li');
            item.textContent = `${component.label} (${component.id})`;
            list.appendChild(item);
          });
        })
        .catch((error) => {
          console.error('Unable to load manifest', error);
        });
    </script>
  </body>
</html>
